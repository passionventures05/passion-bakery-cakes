# ============================================================================
#  Decap CMS configuration  –  PassionBakeryNChocos (cakes)
#  >>> BEFORE GOING LIVE, EDIT THESE TWO VALUES (see docs/CMS-SETUP.md) <<<
#      repo:      your GitHub  "username/repository"
#      base_url:  the address of your deployed Cloudflare login worker
# ============================================================================
backend:
  name: github
  repo: passionventures05/passion-bakery-cakes            # <-- EDIT
  branch: main
  base_url: https://passion-cms-auth.passionventures.workers.dev
  auth_endpoint: auth
  commit_messages:
    create: 'Add cake "{{slug}}"'
    update: 'Update cake "{{slug}}"'
    delete: 'Delete cake "{{slug}}"'
    uploadMedia: 'Upload photo "{{path}}"'
    deleteMedia: 'Delete photo "{{path}}"'

# Used only when you run the CMS on your own computer (npm run dev:cms). Ignored on the live site.
local_backend: true

publish_mode: simple            # saving = published (the site rebuilds in about a minute)
site_url: https://passionbakerynchocos.com
display_url: https://passionbakerynchocos.com
logo_url: /Cake_Logo.jpg
locale: en

media_folder: public/uploads/products
public_folder: /uploads/products

collections:
  - name: cakes
    label: Cakes
    label_singular: Cake
    description: Every cake shown on the website. Add a new cake, change a price or photo, or hide a cake.
    folder: content/products
    create: true
    delete: true
    extension: json
    format: json
    slug: "{{slug}}"
    identifier_field: name
    summary: "{{name}}  ·  {{category}}  ·  ₹{{basePrice}}"
    sortable_fields: ["name", "category", "basePrice", "order"]
    view_filters:
      - { label: "Hidden cakes", field: available, pattern: false }
      - { label: "No photo yet", field: image, pattern: "^$" }
    view_groups:
      - { label: Category, field: category }
    fields:
      - label: Cake name
        name: name
        widget: string
        hint: "Shown to customers. Each cake must have a different name."
        pattern: ["^.{3,80}$", "Please enter 3 to 80 characters"]

      - label: Photo
        name: image
        widget: image
        required: false
        hint: "JPG or WebP, at least 800 px wide, under 800 KB. A cake photo taken from the front/top works best."

      - label: Category
        name: category
        widget: select
        options:
          - "Chocolate"
          - "Vanilla"
          - "Custom Cake"
          - "Rich Chocolate Truffle"
          - "Occasion Cake"
          - "Flavoured Cakes"
          - "Traditional Fusion Cakes"
          - "Red Velvet Cake"
          - "Dry Cakes"
          - "Theme Cakes (Fondant or Chocolate)"
          - "Fondant & Semi Fondant Cake"
          - "Multi-Tier Cake"
          - "Low Sugar Cake"
          - "Diabetic Cake"
          - "Cheese Cake"
          - "Photo Cake"

      - label: Starting price (₹)
        name: basePrice
        widget: number
        value_type: int
        min: 1
        hint: "The price for the BASE SIZE chosen below. Other sizes are priced in proportion (a 1 kg cake costs 2 x the 500 g price)."

      - label: Base size (the size the price above is for)
        name: baseQuantity
        widget: select
        default: "500gm"
        options:
          - { label: "250 g", value: "250gm" }
          - { label: "500 g", value: "500gm" }
          - { label: "600 g", value: "600gm" }
          - { label: "750 g", value: "750gm" }
          - { label: "1 kg", value: "1kg" }
          - { label: "1.5 kg", value: "1.5kg" }
          - { label: "2 kg", value: "2kg" }
          - { label: "2.5 kg", value: "2.5kg" }
          - { label: "3 kg", value: "3kg" }
          - { label: "4 kg", value: "4kg" }
          - { label: "5 kg", value: "5kg" }
          - { label: "1 piece", value: "1pc" }
          - { label: "2 pieces", value: "2pc" }
          - { label: "3 pieces", value: "3pc" }
          - { label: "4 pieces", value: "4pc" }
          - { label: "5 pieces", value: "5pc" }
          - { label: "6 pieces", value: "6pc" }
          - { label: "7 pieces", value: "7pc" }
          - { label: "8 pieces", value: "8pc" }
          - { label: "10 pieces", value: "10pc" }
          - { label: "12 pieces", value: "12pc" }

      - label: Sizes customers can choose
        name: availableQuantities
        widget: select
        multiple: true
        min: 1
        default: ["500gm", "1kg", "1.5kg", "2kg"]
        hint: "Tick every size you sell. Use EITHER weights (cakes) OR pieces (jars, cupcakes) – not both."
        options:
          - { label: "250 g", value: "250gm" }
          - { label: "500 g", value: "500gm" }
          - { label: "600 g", value: "600gm" }
          - { label: "750 g", value: "750gm" }
          - { label: "1 kg", value: "1kg" }
          - { label: "1.5 kg", value: "1.5kg" }
          - { label: "2 kg", value: "2kg" }
          - { label: "2.5 kg", value: "2.5kg" }
          - { label: "3 kg", value: "3kg" }
          - { label: "4 kg", value: "4kg" }
          - { label: "5 kg", value: "5kg" }
          - { label: "1 piece", value: "1pc" }
          - { label: "2 pieces", value: "2pc" }
          - { label: "3 pieces", value: "3pc" }
          - { label: "4 pieces", value: "4pc" }
          - { label: "5 pieces", value: "5pc" }
          - { label: "6 pieces", value: "6pc" }
          - { label: "7 pieces", value: "7pc" }
          - { label: "8 pieces", value: "8pc" }
          - { label: "10 pieces", value: "10pc" }
          - { label: "12 pieces", value: "12pc" }

      - label: Description
        name: description
        widget: text
        required: false
        hint: "A sentence or two about the flavour, layers, toppings. Shown when a customer opens the cake."

      - label: Show on website
        name: available
        widget: boolean
        default: true
        hint: "Switch OFF to hide the cake without deleting it (e.g. out of season)."

      - label: Position in the list
        name: order
        widget: number
        value_type: int
        required: false
        hint: "1 = shown first. Leave empty to put the cake at the end. Tip: use 5 to place it before the cake that is at 10."
