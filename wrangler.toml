name = "passion-cms-auth"
main = "src/index.js"
compatibility_date = "2025-01-01"

[vars]
# Comma-separated list of sites allowed to receive the login token (no trailing slash, no path).
# Keep both entries if visitors can reach the site with or without "www".
ALLOWED_ORIGINS = "https://passionbakerynchocos.com,https://www.passionbakerynchocos.com"
# GitHub Pages (free) needs a PUBLIC repository, so the narrower "public_repo" permission is enough.
GITHUB_SCOPE = "public_repo,user"

# Secrets (NOT stored here) - set once with:
#   npx wrangler secret put GITHUB_CLIENT_ID
#   npx wrangler secret put GITHUB_CLIENT_SECRET
